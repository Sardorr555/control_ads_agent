# ==============================================================================
# SWIPIES Nginx Reverse Proxy Configuration (Track 3 Process Isolation)
# Target: /etc/nginx/conf.d/attribution.conf or integrated into site config
# ==============================================================================

# Rate-limiting zone: 30 requests/sec per IP, 10MB memory zone (~160,000 IPs)
limit_req_zone $binary_remote_addr zone=track_limit:10m rate=30r/s;

upstream swipies_api_core {
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream swipies_tracker_service {
    server 127.0.0.1:5001;
    keepalive 64;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name _;

    # 1. Static client tracker serving with gzip & cache
    location = /swipies-tracker.js {
        alias /var/www/swipies/web/public/swipies-tracker.js;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=600";
        access_log off;
    }

    # 2. High-throughput tracking ingestion (ISOLATED TO PORT 5001)
    location /api/v1/track/ {
        limit_req zone=track_limit burst=20 nodelay;

        proxy_pass http://swipies_tracker_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Strict 1-second timeout: tracking failure MUST NOT hang client or upstream
        proxy_connect_timeout 1s;
        proxy_send_timeout 1s;
        proxy_read_timeout 1s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for fast async ack
        proxy_buffering off;
    }

    # 3. Critical Payment Core & Business API (PORT 5000)
    # Protected from tracker traffic spikes; standard timeouts preserved
    location /api/pay/ {
        proxy_pass http://swipies_api_core;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
